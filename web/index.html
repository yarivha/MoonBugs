<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- user-scalable=no stops double-tap zoom from fighting the fire button;
       viewport-fit=cover fills past the notch on phones. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Moon Bugs — Lunar Defense</title>
  <meta name="description" content="Defend a row of fuel drums on the lunar surface from swooping alien bugs — a modern homage to Windmill Software's 1983 Moon Bugs." />
  <style>
    /* Exposed as custom properties so the sizing script can read the values —
       env() is not otherwise reachable from JS. */
    :root {
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #07070f; color: #b9b9c8;
      font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      /* Top-anchored, horizontally centred: the safe-area shrink below is a
         bottom inset (the home indicator), so the leftover strip has to fall
         at the bottom rather than being split half above the game. */
      display: flex; align-items: flex-start; justify-content: center;
    }
    /* The canvas fills the viewport and is sized 1:1 with it. Do NOT scale it
       with CSS: the macroquad bundle reports pointer positions as
       (clientX - rect.left) * devicePixelRatio, with no correction for a
       display size that differs from the backing store — every tap would land
       somewhere else. Sizing is left to the bundle, which sets
       canvas.width = clientWidth * dpr and re-runs it on window resize. */
    canvas {
      display: block; outline: none;
      /* Fill the visible screen. The game lays itself out from screen_width()/
         screen_height() and scales its UI to fit, so any aspect works.

         Height is the fiddly part on phones: 100vh on iOS Safari is the
         viewport WITHOUT the browser toolbars, so a 100vh canvas is taller
         than what you can see and the centred layout crops the top (score)
         and bottom (drums and ground). dvh tracks the actual visible height;
         the script below also sets an exact pixel height for browsers without
         it, and re-fits on rotation. */
      width: 100vw; height: 100vh; height: 100dvh;
      touch-action: none;          /* no scroll/pinch stealing the controls */
      -webkit-tap-highlight-color: transparent;
    }
    /* Overlaid, never in the layout, and never eating a tap. */
    #hint {
      position: fixed; left: 0; right: 0; bottom: env(safe-area-inset-bottom, 6px);
      margin: 0; padding: 4px 12px; text-align: center;
      font-size: 12px; opacity: .5; pointer-events: none;
    }
    /* On a touch device the canvas fills the screen, so this caption would lie
       across the drums. The menu already explains the controls there. */
    @media (pointer: coarse) { #hint { display: none; } }
  </style>
</head>
<body>
  <!-- tabindex lets the canvas take keyboard focus, without which no key
       events reach the game on desktop. The game draws from its very first
       frame: audio decodes in the background rather than blocking startup. -->
  <canvas id="glcanvas" tabindex="1"></canvas>
  <p id="hint">Desktop: click, then ENTER. &nbsp;·&nbsp; Phone: tap to start, then hold anywhere — the buggy drives to your finger and fires.</p>

  <script>
    // macroquad 0.4's mq_js_bundle.js is "use strict" yet assigns to a bare,
    // undeclared `register_plugin` in its quad_net section. That throws a
    // ReferenceError which aborts the tail of the bundle. Pre-declaring the
    // global here makes the assignment legal.
    var register_plugin;
  </script>
  <script src="mq_js_bundle.js"></script>
  <script>
    // Wrapped in an IIFE on purpose: the bundle declares top-level `canvas`
    // and `gl`, and re-declaring either name here throws a SyntaxError that
    // silently kills this entire script (so load() would never run).
    (function () {
      var mb = document.getElementById("glcanvas");
      mb.focus();
      document.addEventListener("click", function () { mb.focus(); });

      // Pin the canvas to the *visible* viewport in real pixels. Needed for
      // iOS Safari, where 100vh overshoots by the toolbar height; harmless
      // everywhere else. Re-run on resize and rotation — the macroquad bundle
      // watches the canvas box and resizes its backing store to match.
      function inset(name) {
        var v = parseFloat(
          getComputedStyle(document.documentElement).getPropertyValue(name)
        );
        return isFinite(v) ? v : 0;
      }

      function fit() {
        // visualViewport is the truly visible area — the one measurement that
        // excludes iOS Safari's toolbars. innerWidth/Height is the fallback.
        var vv = window.visualViewport;
        var w = Math.round(vv ? vv.width : window.innerWidth);
        var h = Math.round(vv ? vv.height : window.innerHeight);
        // Keep clear of the home indicator and the notch. viewport-fit=cover
        // lets the page reach into them, which would bury the bottom row of
        // the game — the ground, the drums and the version stamp — under the
        // indicator bar. Shrinking instead letterboxes those strips.
        w -= inset("--sal") + inset("--sar");
        h -= inset("--sab");
        // A hidden or not-yet-laid-out page reports ~0. Writing that through
        // would freeze the canvas at a useless size, since miniquad reads it
        // once at init; leave it alone and let boot() keep waiting.
        if (w < 16 || h < 16) return;
        mb.style.width = Math.round(w) + "px";
        mb.style.height = Math.round(h) + "px";
      }
      fit();
      window.addEventListener("resize", fit);
      window.addEventListener("orientationchange", function () {
        setTimeout(fit, 150); // iOS reports the new size a beat after rotating
      });
      if (window.visualViewport) {
        // Safari collapses and expands its toolbars without always firing a
        // window resize; the visual viewport always reports it.
        window.visualViewport.addEventListener("resize", fit);
        window.visualViewport.addEventListener("scroll", fit);
      }

      // Don't start until the canvas actually has a laid-out box. miniquad
      // reads its size at init, so booting in a page that hasn't been laid out
      // yet (a hidden or background tab, where clientWidth reads 0) leaves a
      // 0x0 canvas for good. requestAnimationFrame is paused while hidden, so
      // this simply waits for the page to be shown.
      (function boot() {
        if (mb.clientWidth === 0 || mb.clientHeight === 0) {
          requestAnimationFrame(boot);
          return;
        }
        // The ?v= is rewritten to the crate version by tools/build_web.sh.
        // Filenames are stable across releases, so without it a cached wasm
        // keeps running the old game after a deploy — the HTML updates (it is
        // served no-cache) while the code it points at does not.
        load("moonbugs.wasm?v=__MB_VERSION__");
      })();
    })();
  </script>
</body>
</html>
