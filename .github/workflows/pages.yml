name: Web

# Build the WebAssembly version and publish it to GitHub Pages, so the game is
# playable in a browser at https://<owner>.github.io/<repo>/.
#
# One-time setup: repository Settings → Pages → "Build and deployment" →
# Source: "GitHub Actions". Without that, the deploy step fails.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer commit supersede an in-flight deploy, but never cancel a deploy
# halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (with wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build dist/web
        run: ./tools/build_web.sh

      # Note: `enablement: true` here does NOT work — creating a Pages site
      # over the API needs repo-admin rights that the workflow's GITHUB_TOKEN
      # does not have ("Resource not accessible by integration"). Pages has to
      # be switched on once by hand: Settings -> Pages -> Source: "GitHub
      # Actions". After that this step just finds the existing site.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
